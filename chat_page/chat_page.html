<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat</title>

    <script src="../lib/marked.min.js"></script>
    <script src="../lib/purify.min.js"></script>



    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --surface-light: #252525;
            --text: #e0e0e0;
            --accent: #4dabf7;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent);
        }

        #chat-container {
            border: 1px solid #333;
            height: 550px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 12px;
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
            scroll-behavior: smooth;
        }

        .message {
            margin: 12px 0;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: var(--accent);
            color: #000;
            margin-left: auto;
            text-align: right;
        }

        .assistant {
            background: var(--surface-light);
        }

        #input-container {
            display: flex;
            gap: 12px;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: var(--surface-light);
            color: var(--text);
        }

        #send-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        #send-btn:hover {
            filter: brightness(1.15);
        }
    </style>
</head>

<body>
    <h1>AI Chat</h1>
    <div id="chat-container"></div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Type your message..." />
        <button id="send-btn">Send</button>
    </div>

    <script src="chat_page.js"></script>
</body>
</html>
