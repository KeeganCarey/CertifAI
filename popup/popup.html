<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    h3 {
      margin-top: 0;
    }
    .upload-area {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin: 10px 0;
      cursor: pointer;
    }
    .upload-area:hover {
      border-color: #4CAF50;
      background-color: #f9f9f9;
    }
    input[type="file"] {
      display: none;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #openChatButton {
      background-color: #2196F3;
    }
    #openChatButton:hover {
      background-color: #0b7dda;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
    }
    .error {
      color: #f44336;
    }
    .success {
      color: #4CAF50;
    }
  </style>
</head>
<body>
  <h3>CertifAI</h3>
  
  <div class="upload-area" id="uploadArea">
    <p>Click to upload a PDF</p>
    <p style="font-size: 12px; color: #666;">Input business files that contain information that can be used to fill out these forms</p>
  </div>
  <input type="file" id="fileInput" accept=".pdf">
  
  <button id="fillButton">Fill Form</button>
  <button id="openChatButton">Open AI Chat</button>
  
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
