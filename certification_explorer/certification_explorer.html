<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oakland Certification Explorer</title>
    <style>
        /* General Layout */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            /* Increased width to accommodate 2 columns comfortably */
            max-width: 1200px; 
            margin: 0 auto;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2rem;
            text-align: center;
        }

        /* Loading State */
        #status-message {
            text-align: center;
            font-size: 1.1rem;
            color: #666;
        }

        /* GRID LAYOUT FOR COLUMNS */
        #certification-list {
            display: grid;
            grid-template-columns: 1fr; /* Default: 1 column */
            gap: 30px; /* Space between columns and rows */
        }

        /* When screen is wider than 900px, switch to 2 columns */
        @media (min-width: 900px) {
            #certification-list {
                grid-template-columns: 1fr 1fr; 
            }
        }

        /* Card Styling */
        .cert-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            /* Removed margin-bottom because 'gap' in grid handles spacing now */
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            
            /* Ensures cards in the same row are equal height */
            display: flex;
            flex-direction: column;
        }

        .cert-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        /* Selected State Styling */
        .cert-card.selected {
            border-color: #2ecc71;
            background-color: #f0fff4;
        }

        .card-header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 25px;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .card-body {
            padding: 25px;
            /* Pushes footer to the bottom if content is short */
            flex-grow: 1; 
        }

        .summary {
            font-size: 1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }

        /* Requirements List Styling */
        .requirements-box {
            background-color: #f8f9fa;
            border-left: 5px solid #3498db;
            padding: 15px 20px;
            border-radius: 4px;
        }

        .requirements-box h3 {
            margin-top: 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #7f8c8d;
            letter-spacing: 1px;
        }

        .requirements-box ul {
            margin: 10px 0 0 0;
            padding-left: 20px;
        }

        .requirements-box li {
            margin-bottom: 8px;
            color: #444;
        }

        /* Action Buttons */
        .card-footer {
            padding: 20px 25px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            margin-top: auto; /* Ensures footer sticks to bottom */
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            display: inline-block;
        }

        .btn-link {
            color: #3498db;
            background: transparent;
            border: 1px solid transparent;
        }

        .btn-link:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .btn-select {
            background-color: #2ecc71;
            color: white;
            border: none;
        }

        .btn-select:hover {
            background-color: #27ae60;
        }

        .selected .btn-select {
            background-color: #27ae60;
            cursor: default;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Available Certifications</h1>
        <div id="status-message">Loading data...</div>
        <div id="certification-list">
            </div>
    </div>

    <script src="certification_explorer.js"></script>
</body>
</html>
